<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JikJik is offline</title>
    <style>
      @font-face {
        font-family: "Inter Variable";
        src: url("/inter-latin-wght-normal.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }

      :root {
        color-scheme: light;
        --background: oklch(1 0 0);
        --foreground: oklch(0.153 0.006 107.1);
        --secondary: oklch(0.967 0.001 286.375);
        --muted-foreground: oklch(0.487 0 0);
        --primary: oklch(0.852 0.199 91.936);
        --primary-foreground: oklch(0.421 0.095 57.708);
        --chart-2: oklch(0.768 0.233 130.85);
        --ring: oklch(0.737 0.021 106.9);
        font: 1rem / 1.5 "Inter Variable", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
      }

      .layout {
        display: grid;
        min-height: 100dvh;
      }

      .brand-panel {
        display: none;
      }

      .status-panel {
        display: grid;
        place-items: center;
        padding: 2rem 1.75rem;
        background: url("/login-page-background.svg") no-repeat center bottom / cover;
      }

      .status-content {
        width: 100%;
        max-width: 26.25rem;
        text-align: center;
      }

      .brand-logo {
        display: grid;
        place-items: center;
        width: 3rem;
        height: 3rem;
        margin: 0 auto 2.5rem;
        border-radius: 0.75rem;
        background: linear-gradient(135deg, var(--primary), var(--chart-2));
        color: white;
        font-size: 1.5rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .description {
        margin: 0.25rem 0 2rem;
        color: var(--muted-foreground);
      }

      .retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 2.25rem;
        padding: 0 0.75rem;
        border-radius: 1.625rem;
        background: var(--primary);
        color: var(--primary-foreground);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }

      .retry:hover {
        background: color-mix(in oklab, var(--primary) 80%, transparent);
      }

      .retry:focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 2px;
      }

      @media (min-width: 1280px) {
        body {
          display: grid;
          min-height: 100dvh;
          place-items: center;
          background: var(--secondary);
        }

        .layout {
          grid-template-columns: 52% 48%;
          width: 90%;
          max-width: 80rem;
          min-height: 0;
          height: min(100dvh, 37.5rem);
          overflow: hidden;
          border-radius: 1.625rem;
          box-shadow: 0 24px 70px oklch(0.153 0.006 107.1 / 0.08);
        }

        .brand-panel {
          display: grid;
          place-items: center;
          padding: 2rem;
          background: url("/login-page-background.svg") no-repeat left bottom / cover;
        }

        .brand-panel p {
          margin: 0;
        }

        .brand-panel .tagline {
          margin-bottom: 0.625rem;
        }

        .brand-panel .caption {
          color: var(--muted-foreground);
        }

        .status-panel {
          background: var(--background);
        }

        .description {
          margin-top: 0.875rem;
        }
      }

      @media (min-width: 1280px) and (max-height: 600px) {
        .layout {
          width: 100%;
          max-width: none;
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="layout">
      <aside class="brand-panel">
        <div>
          <p class="tagline">Simple Chats.<br />Real connections.</p>
          <p class="caption">
            Jik Jik makes it easy to stay in touch<br />
            with the people who matter.
          </p>
        </div>
      </aside>

      <section class="status-panel" aria-labelledby="offline-title">
        <div class="status-content">
          <div class="brand-logo" aria-hidden="true">J</div>
          <h1 id="offline-title">You’re offline</h1>
          <p class="description">Reconnect to the internet to access your chats.</p>
          <a class="retry" href="/">Try again</a>
        </div>
      </section>
    </main>
  </body>
</html>
